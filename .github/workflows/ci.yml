name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ⛔ So a run can be asked for by hand. On 2026-10-31 this repository stopped
  # receiving pull_request events: a branch pushed, a PR opened, the PR closed
  # and reopened, the branch deleted and re-pushed and a second PR opened —
  # nine events, zero workflow runs, while go-pdfkit/conformance fired within
  # seconds of an identical push. Repository and org settings were identical
  # (not archived, not disabled, Actions enabled, workflow active). With no
  # dispatch trigger there was no way to ask for the run that the events had
  # failed to start, which is a gap worth closing whatever caused it.
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: Build + test + exact 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ⛔ 1.27.4 BECAUSE THE STEP BELOW NEEDS IT, and GOTOOLCHAIN=local means
      # the runner will not quietly fetch a newer one — which is the setting
      # that made this a visible failure instead of a silent toolchain swap.
      # fleettools v0.111.0 declares `go >= 1.27.4`, so 1.27.3 refused to
      # install aptneed at all: `requires go >= 1.27.4 (running go 1.27.3)`.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          check-latest: true
          cache: true

      # ⛔⛔ THIS STEP USED TO BE `sudo apt-get update && sudo apt-get install …`
      # AND A THIRD PARTY'S DNS HELD EVERY RELEASE HOSTAGE. On 2026-11-11 it
      # failed four times in half an hour on one merge commit, every time with
      # `Temporary failure resolving 'azure.archive.ubuntu.com'`, while the
      # pull request it came from had been green on this same workflow minutes
      # earlier. `ghrelease` will not tag while main is red — correctly — so
      # nothing about this repository was wrong and nothing could be released,
      # and the step had no way to say which of the two it was (#90).
      #
      # `aptneed` rewrites /etc/apt/apt-mirrors.txt to the canonical archive
      # after the first mirror failure — that one file is what every source on
      # a runner resolves through, so naming archive.ubuntu.com in a source
      # would change nothing — and it refuses to retry a package apt cannot
      # locate, which is a name and not weather.
      #
      # ⛔ --need pdftoppm, because apt saying yes is not the binary being
      # there. The two render tests `t.Fatal` when CI is set and pdftoppm is
      # missing, so a package renamed upstream would otherwise reach them.
      - name: Install poppler, the foreign judge the render tests print by
        run: |
          GOBIN=/usr/local/bin go install github.com/go-fleettools/fleettools/cmd/aptneed@latest
          sudo aptneed --need pdftoppm poppler-utils

      - name: go vet
        run: go vet ./...

      - name: Test with coverage
        run: go test -covermode=set -coverprofile=coverage.out ./...

      - name: Assert exact 100% statement coverage
        run: |
          go tool cover -func=coverage.out | tail -n +1 > /tmp/cov.txt
          below=$(go tool cover -func=coverage.out | awk '$3 != "100.0%"')
          if [ -n "$below" ]; then
            echo "::error::coverage below 100%"
            echo "$below"
            exit 1
          fi
          echo "all statements covered (100.0%)"

      - name: Cross-compile (6 64-bit arches + wasm + darwin + windows)
        run: |
          for arch in amd64 arm64 riscv64 loong64 ppc64le s390x; do
            echo "== linux/$arch =="
            GOOS=linux GOARCH=$arch go build ./...
          done
          GOOS=js      GOARCH=wasm  go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...
